<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CasaPro — demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#0F5C4E;--g2:#12705E;--mint:#E4F3EE;--lime:#63C99A;--ink:#0D1F1B;--mute:#6C8079;--line:#DCE8E4;--bg:#F6FAF8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Manrope",system-ui,sans-serif;background:#0B1512;color:var(--ink);display:flex;justify-content:center;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font:inherit}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.app{width:100%;max-width:420px;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:520px){
  body{align-items:center;padding:24px 0;background:radial-gradient(1200px 600px at 50% 0%,#173a32,#0B1512)}
  .app{min-height:0;height:844px;border-radius:34px;box-shadow:0 30px 70px rgba(0,0,0,.5);border:8px solid #1D2E29}
}
.top{background:linear-gradient(160deg,var(--g2),var(--g));color:#fff;padding:16px 18px 24px;flex:0 0 auto}
.util{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.back-link{color:rgba(255,255,255,.85);font-size:12.5px;text-decoration:none;background:rgba(0,0,0,.2);padding:6px 11px;border-radius:16px}
.langs{display:flex;gap:3px;background:rgba(0,0,0,.2);border-radius:16px;padding:3px}
.lg{font-size:11.5px;font-weight:800;letter-spacing:.05em;padding:4px 9px;border-radius:13px;color:rgba(255,255,255,.7)}
.lg[aria-pressed="true"]{background:#fff;color:var(--g)}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:40px;height:40px;border-radius:13px;background:var(--lime);color:#0B322A;display:grid;place-items:center;font-weight:800;font-size:19px}
.brand h1{font-size:19px;font-weight:800}
.brand small{display:block;font-size:11.5px;font-weight:500;opacity:.8;margin-top:1px}
.greet{margin-top:18px;font-size:22px;font-weight:800;line-height:1.2}
.greet span{opacity:.75;font-weight:500;font-size:14px;display:block;margin-top:4px}
.scroll{flex:1;overflow-y:auto;padding:18px 16px 96px}
.lbl{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:4px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.svc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.svc:active{transform:scale(.97)}
.svc .ic{width:38px;height:38px;border-radius:11px;background:var(--mint);display:grid;place-items:center;font-size:20px}
.svc .nm{font-weight:700;font-size:14.5px;line-height:1.25}
.svc .pr{font-weight:800;font-size:15px;color:var(--g)}
.svc .un{font-size:11px;color:var(--mute);font-weight:500}
.banner{background:var(--g);color:#fff;border-radius:16px;padding:16px 18px;margin:20px 0 6px;display:flex;gap:13px;align-items:center}
.banner .b-ic{font-size:24px}
.banner b{display:block;font-size:14.5px}
.banner small{font-size:12.5px;opacity:.85}
.screen{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:20}
.screen.on{transform:translateX(0)}
.sh-top{background:#fff;border-bottom:1px solid var(--line);padding:16px;display:flex;align-items:center;gap:12px;flex:0 0 auto}
.sh-top h2{font-size:16.5px;font-weight:800}
.sh-top small{display:block;font-size:12px;color:var(--mute);font-weight:500}
.bk{width:36px;height:36px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.chips{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:10px 13px;text-align:center;min-width:62px}
.chip b{display:block;font-size:16px;font-weight:800}
.chip small{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.chip[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:#fff}
.chip[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.slot{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 6px;font-weight:700;font-size:14.5px}
.slot[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:#fff}
.slot[disabled]{opacity:.4;text-decoration:line-through}
.field{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;font-size:15px}
.field::placeholder{color:#9DB0AA}
textarea.field{resize:none;height:70px}
.addr{display:grid;gap:8px}
.addr .row{display:grid;grid-template-columns:2.2fr 1fr;gap:8px}
.addr .row2{display:grid;grid-template-columns:1.6fr 1fr;gap:8px}
.rec{display:flex;gap:9px;margin-top:10px}
.rec button{flex:1;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 4px;font-size:12.5px;font-weight:700}
.rec button[aria-pressed="true"]{background:var(--mint);border-color:var(--g);color:var(--g)}
.summary{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:18px}
.sline{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;padding:7px 0;color:#43584F}
.sline.tot{border-top:1px dashed var(--line);margin-top:8px;padding-top:12px;font-size:18px;font-weight:800;color:var(--ink)}
.footbar{position:absolute;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);z-index:25}
.cta{width:100%;background:var(--g);color:#fff;border-radius:14px;padding:16px;font-size:16px;font-weight:800}
.cta[disabled]{background:#B7C9C3}
.cta.alt{background:var(--mint);color:var(--g)}
.nav{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:9px 6px calc(9px + env(safe-area-inset-bottom));z-index:15}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--mute);padding:5px 0}
.nav button .i{font-size:19px}
.nav button[aria-current="page"]{color:var(--g)}
.done{text-align:center;padding:34px 22px}
.tick{width:74px;height:74px;border-radius:50%;background:var(--lime);color:#0B322A;display:grid;place-items:center;font-size:38px;margin:0 auto 18px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.done h2{font-size:23px;font-weight:800;margin-bottom:8px}
.done p{color:var(--mute);font-size:15px;line-height:1.5}
.code{display:inline-block;margin-top:16px;background:var(--mint);color:var(--g);font-weight:800;letter-spacing:.08em;padding:9px 16px;border-radius:10px;font-size:15px}
.remind{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:16px;text-align:left;display:flex;gap:12px;align-items:flex-start}
.remind .r-ic{font-size:20px}
.remind b{font-size:14px;display:block;margin-bottom:3px}
.remind small{color:var(--mute);font-size:13px;line-height:1.45}
.appt{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:11px;display:flex;gap:13px;align-items:center}
.appt .d{background:var(--mint);border-radius:11px;padding:8px 11px;text-align:center;flex:0 0 auto}
.appt .d b{display:block;font-size:19px;font-weight:800;color:var(--g);line-height:1}
.appt .d small{font-size:10px;text-transform:uppercase;font-weight:800;letter-spacing:.06em;color:var(--g)}
.appt .m{flex:1;min-width:0}
.appt .m b{font-size:15px;display:block}
.appt .m small{color:var(--mute);font-size:12.5px}
.empty{text-align:center;color:var(--mute);padding:50px 24px;font-size:15px;line-height:1.5}
.empty .e-ic{font-size:40px;display:block;margin-bottom:12px;opacity:.5}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top" id="topBar">
    <div class="util">
      <a class="back-link" href="index.html" id="backLink">← voltar</a>
      <div class="langs"><button class="lg" data-lang="pt" aria-pressed="true">PT</button><button class="lg" data-lang="en">EN</button><button class="lg" data-lang="es">ES</button></div>
    </div>
    <div class="brand">
      <div class="mark">C</div>
      <div><h1>CasaPro Orlando</h1><small data-i="hours"></small></div>
    </div>
    <div class="greet"><span id="greetName"></span><span data-i="greetSub"></span></div>
  </div>

  <div class="scroll" id="home">
    <div class="lbl" data-i="services"></div>
    <div class="grid" id="svcGrid"></div>
    <div class="banner">
      <div class="b-ic">🔔</div>
      <div><b data-i="banT"></b><small data-i="banD"></small></div>
    </div>
  </div>

  <div class="scroll" id="agenda" style="display:none">
    <div class="lbl" data-i="myAppts"></div>
    <div id="apptList"></div>
  </div>

  <div class="scroll" id="perfil" style="display:none">
    <div class="lbl" data-i="myData"></div>
    <div class="appt" style="align-items:center">
      <div class="d" style="padding:12px 14px"><b style="font-size:20px">M</b></div>
      <div class="m"><b id="pfName"></b><small>marcos@email.com · (321) 555-0148</small></div>
    </div>
    <div class="lbl" style="margin-top:20px" data-i="savedAddr"></div>
    <div class="appt"><div class="m"><b data-i="home"></b><small>1420 Winter Garden Vineland Rd, Orlando FL 34787</small></div><div style="font-size:20px">🏠</div></div>
    <div class="lbl" style="margin-top:20px" data-i="prefs"></div>
    <div class="appt"><div class="m"><b data-i="language"></b><small data-i="langHint"></small></div><div style="font-weight:800;color:var(--g)" id="pfLang">PT</div></div>
    <div class="appt"><div class="m"><b data-i="pushT"></b><small data-i="pushD"></small></div><div style="font-size:20px">🔔</div></div>
    <div class="appt"><div class="m"><b data-i="payT"></b><small>Visa •••• 4021</small></div><div style="font-size:20px">💳</div></div>
  </div>

  <nav class="nav">
    <button aria-current="page" data-tab="home"><span class="i">🏠</span><span data-i="navHome"></span></button>
    <button data-tab="agenda"><span class="i">📅</span><span data-i="navAgenda"></span></button>
    <button data-tab="perfil"><span class="i">👤</span><span data-i="navProfile"></span></button>
  </nav>

  <div class="screen" id="book">
    <div class="sh-top">
      <button class="bk" data-close="book">←</button>
      <div><h2 id="bkName">—</h2><small id="bkPrice">—</small></div>
    </div>
    <div class="scroll" style="padding-bottom:110px">
      <div class="lbl" data-i="pickDay"></div>
      <div class="chips" id="days"></div>
      <div class="lbl" style="margin-top:20px" data-i="pickTime"></div>
      <div class="slots" id="slots"></div>

      <div class="lbl" style="margin-top:20px" data-i="address"></div>
      <div class="addr">
        <div class="row">
          <input class="field" id="aStreet" value="Winter Garden Vineland Rd">
          <input class="field" id="aNum" value="1420" inputmode="numeric">
        </div>
        <input class="field" id="aUnit">
        <div class="row2">
          <input class="field" id="aCity" value="Orlando, FL">
          <input class="field" id="aZip" value="34787" inputmode="numeric">
        </div>
      </div>

      <div class="lbl" style="margin-top:18px" data-i="noteLbl"></div>
      <textarea class="field" id="note"></textarea>

      <div class="lbl" style="margin-top:20px" data-i="repeat"></div>
      <div class="rec" id="rec">
        <button aria-pressed="true" data-r="0" data-i="recOnce"></button>
        <button data-r="2" data-i="rec15"></button>
        <button data-r="4" data-i="recMonth"></button>
      </div>

      <div class="summary">
        <div class="sline"><span id="sumSvc">—</span><span id="sumPrice">$0</span></div>
        <div class="sline"><span data-i="travel"></span><span data-i="included"></span></div>
        <div class="sline tot"><span data-i="total"></span><span id="sumTotal">$0</span></div>
      </div>
    </div>
    <div class="footbar"><button class="cta" id="confirmBtn" disabled>—</button></div>
  </div>

  <div class="screen" id="done">
    <div class="sh-top"><button class="bk" data-close="done">←</button><div><h2 data-i="confirmedTitle"></h2></div></div>
    <div class="scroll" style="padding-bottom:110px">
      <div class="done">
        <div class="tick">✓</div>
        <h2 data-i="booked"></h2>
        <p id="doneTxt">—</p>
        <div class="code" id="doneCode">#CP-0000</div>
        <div class="remind"><div class="r-ic">🔔</div><div><b data-i="rem1T"></b><small data-i="rem1D"></small></div></div>
        <div class="remind"><div class="r-ic">💬</div><div><b data-i="rem2T"></b><small data-i="rem2D"></small></div></div>
      </div>
    </div>
    <div class="footbar"><button class="cta alt" data-close="done" data-i="backHome"></button></div>
  </div>
</div>

<script>
const T = {
pt:{code:"pt-BR",back:"← voltar",hours:"Aberto hoje até 18h · Winter Garden",greet:"Olá, Marcos",greetSub:"O que a sua casa precisa hoje?",
 services:"Serviços",banT:"Você não esquece",banD:"Enviamos lembrete 24h e 1h antes de cada serviço.",
 myAppts:"Meus agendamentos",empty:"Nenhum serviço marcado ainda.<br>Escolha um serviço no início para começar.",
 myData:"Meus dados",savedAddr:"Endereço salvo",home:"Casa",prefs:"Preferências",language:"Idioma",langHint:"Toque em PT / EN / ES lá em cima",
 pushT:"Lembretes no celular",pushD:"24h e 1h antes de cada serviço",payT:"Pagamento",
 navHome:"Início",navAgenda:"Agenda",navProfile:"Perfil",
 pickDay:"Escolha o dia",pickTime:"Horário",address:"Endereço",noteLbl:"Observação (opcional)",
 notePh:"Ex.: portão do lado direito, cachorro no quintal",
 street:"Rua ou avenida",num:"Número",unit:"Apto / bloco (opcional)",city:"Cidade e estado",zip:"ZIP",
 repeat:"Repetir",recOnce:"Uma vez",rec15:"A cada 15 dias",recMonth:"Todo mês",
 travel:"Deslocamento",included:"Incluso",total:"Total",
 needDay:"Escolha o dia",needTime:"Escolha um horário",confirm:"Confirmar",
 confirmedTitle:"Pedido confirmado",booked:"Está agendado!",
 rem1T:"Lembrete automático ligado",rem1D:"Você recebe um aviso no celular 24 horas antes e outro 1 hora antes. É isso que faz o cliente não esquecer do horário.",
 rem2T:"O dono já foi avisado",rem2D:"Chega no WhatsApp dele na hora, com serviço, endereço e horário.",
 backHome:"Voltar ao início",repeats:"e repete",every15:"a cada 15 dias",everyMonth:"todo mês",
 dow:["dom","seg","ter","qua","qui","sex","sáb"],
 svc:[["Lavagem de carro","a partir de"],["Limpeza de carpete","até 3 cômodos"],["Lavagem de lixeiras","por mês"],["Pressure washing","calçada e entrada"],["Limpeza de casa","até 2 quartos"],["Limpeza de janelas","casa toda"]]},
en:{code:"en",back:"← back",hours:"Open today until 6pm · Winter Garden",greet:"Hi, Marcus",greetSub:"What does your place need today?",
 services:"Services",banT:"You won't forget",banD:"We send a reminder 24h and 1h before every job.",
 myAppts:"My bookings",empty:"No jobs booked yet.<br>Pick a service on the home screen to start.",
 myData:"My details",savedAddr:"Saved address",home:"Home",prefs:"Preferences",language:"Language",langHint:"Tap PT / EN / ES at the top",
 pushT:"Phone reminders",pushD:"24h and 1h before every job",payT:"Payment",
 navHome:"Home",navAgenda:"Bookings",navProfile:"Profile",
 pickDay:"Pick a day",pickTime:"Time",address:"Address",noteLbl:"Note (optional)",
 notePh:"e.g. gate on the right side, dog in the yard",
 street:"Street",num:"Number",unit:"Apt / unit (optional)",city:"City and state",zip:"ZIP",
 repeat:"Repeat",recOnce:"One time",rec15:"Every 2 weeks",recMonth:"Monthly",
 travel:"Travel",included:"Included",total:"Total",
 needDay:"Pick a day",needTime:"Pick a time",confirm:"Confirm",
 confirmedTitle:"Booking confirmed",booked:"You're booked!",
 rem1T:"Automatic reminder is on",rem1D:"You get an alert on your phone 24 hours before and another 1 hour before. That's what keeps customers from forgetting.",
 rem2T:"The owner already knows",rem2D:"It lands in their WhatsApp right away, with the service, address and time.",
 backHome:"Back to home",repeats:"and repeats",every15:"every 2 weeks",everyMonth:"monthly",
 dow:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
 svc:[["Car wash","starting at"],["Carpet cleaning","up to 3 rooms"],["Bin cleaning","per month"],["Pressure washing","driveway and walkway"],["House cleaning","up to 2 bedrooms"],["Window cleaning","whole house"]]},
es:{code:"es",back:"← volver",hours:"Abierto hoy hasta las 6pm · Winter Garden",greet:"Hola, Marcos",greetSub:"¿Qué necesita tu casa hoy?",
 services:"Servicios",banT:"No se te olvida",banD:"Enviamos recordatorio 24h y 1h antes de cada servicio.",
 myAppts:"Mis reservas",empty:"Todavía no hay servicios agendados.<br>Elige un servicio en el inicio para empezar.",
 myData:"Mis datos",savedAddr:"Dirección guardada",home:"Casa",prefs:"Preferencias",language:"Idioma",langHint:"Toca PT / EN / ES arriba",
 pushT:"Recordatorios en el celular",pushD:"24h y 1h antes de cada servicio",payT:"Pago",
 navHome:"Inicio",navAgenda:"Reservas",navProfile:"Perfil",
 pickDay:"Elige el día",pickTime:"Horario",address:"Dirección",noteLbl:"Nota (opcional)",
 notePh:"Ej.: portón del lado derecho, perro en el patio",
 street:"Calle o avenida",num:"Número",unit:"Apto / unidad (opcional)",city:"Ciudad y estado",zip:"ZIP",
 repeat:"Repetir",recOnce:"Una vez",rec15:"Cada 15 días",recMonth:"Cada mes",
 travel:"Traslado",included:"Incluido",total:"Total",
 needDay:"Elige el día",needTime:"Elige un horario",confirm:"Confirmar",
 confirmedTitle:"Pedido confirmado",booked:"¡Está agendado!",
 rem1T:"Recordatorio automático activado",rem1D:"Recibes un aviso en el celular 24 horas antes y otro 1 hora antes. Eso es lo que evita que el cliente olvide la cita.",
 rem2T:"El dueño ya fue avisado",rem2D:"Le llega al WhatsApp al instante, con el servicio, la dirección y la hora.",
 backHome:"Volver al inicio",repeats:"y se repite",every15:"cada 15 días",everyMonth:"cada mes",
 dow:["dom","lun","mar","mié","jue","vie","sáb"],
 svc:[["Lavado de autos","desde"],["Limpieza de alfombras","hasta 3 cuartos"],["Lavado de botes de basura","por mes"],["Pressure washing","entrada y banqueta"],["Limpieza de casa","hasta 2 recámaras"],["Limpieza de ventanas","toda la casa"]]}};

const ICONS = ["🚗","🧽","🗑️","💦","🧹","🪟"];
const PRICES = [45,120,25,180,140,95];
const TIMES = ["08:00","09:30","11:00","13:00","14:30","16:00"];
const BUSY = {0:["11:00"],1:["08:00","13:00"],2:[],3:["16:00"],4:["09:30","14:30"],5:[],6:["08:00"]};
let lang="pt", t=T.pt, state={i:null,day:null,time:null,rec:0}, appts=[];

const days=[]; for(let i=1;i<=7;i++){const d=new Date();d.setDate(d.getDate()+i);days.push(d);}

function pickLang(){
  const q=new URLSearchParams(location.search).get("lang");
  if(q&&T[q])return q;
  const n=(navigator.language||"pt").slice(0,2).toLowerCase();
  return T[n]?n:"en";
}
function apply(l){
  lang=l; t=T[l];
  document.documentElement.lang=t.code;
  document.querySelectorAll("[data-i]").forEach(el=>{el.textContent=t[el.dataset.i];});
  document.querySelectorAll(".lg").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));
  document.getElementById("backLink").textContent=t.back;
  document.getElementById("backLink").href="index.html?lang="+l;
  document.getElementById("greetName").textContent=t.greet;
  document.getElementById("pfName").textContent=t.greet.replace(/^(Olá|Hi|Hola),?\s*/,"")+" Silva";
  document.getElementById("pfLang").textContent=l.toUpperCase();
  document.getElementById("aStreet").placeholder=t.street;
  document.getElementById("aNum").placeholder=t.num;
  document.getElementById("aUnit").placeholder=t.unit;
  document.getElementById("aCity").placeholder=t.city;
  document.getElementById("aZip").placeholder=t.zip;
  document.getElementById("note").placeholder=t.notePh;
  renderSvc(); renderDays(); renderAppts(); refreshBooking(); update();
}
function renderSvc(){
  document.getElementById("svcGrid").innerHTML=t.svc.map((s,i)=>`
    <button class="svc" data-svc="${i}"><span class="ic">${ICONS[i]}</span>
    <span class="nm">${s[0]}</span><span class="pr">$${PRICES[i]}</span><span class="un">${s[1]}</span></button>`).join("");
}
function renderDays(){
  document.getElementById("days").innerHTML=days.map((d,i)=>`
    <button class="chip" data-day="${i}" aria-pressed="${state.day===i}"><small>${t.dow[d.getDay()]}</small><b>${d.getDate()}</b></button>`).join("");
}
function refreshBooking(){
  if(state.i===null)return;
  const s=t.svc[state.i];
  document.getElementById("bkName").textContent=s[0];
  document.getElementById("bkPrice").textContent=s[1]+" $"+PRICES[state.i];
  document.getElementById("sumSvc").textContent=s[0];
  if(state.day!==null)renderSlots();
}
function renderSlots(){
  const busy=BUSY[days[state.day].getDay()]||[];
  document.getElementById("slots").innerHTML=TIMES.map(x=>
    `<button class="slot" data-t="${x}" aria-pressed="${state.time===x}" ${busy.includes(x)?"disabled":""}>${x}</button>`).join("");
}
document.getElementById("svcGrid").addEventListener("click",e=>{
  const b=e.target.closest("[data-svc]"); if(!b)return;
  state={i:+b.dataset.svc,day:null,time:null,rec:0};
  document.querySelectorAll("#rec button").forEach((o,i)=>o.setAttribute("aria-pressed",i===0));
  renderDays(); document.getElementById("slots").innerHTML="";
  refreshBooking(); update();
  document.getElementById("book").classList.add("on");
});
document.getElementById("days").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b)return;
  state.day=+b.dataset.day; state.time=null;
  renderDays(); renderSlots(); update();
});
document.getElementById("slots").addEventListener("click",e=>{
  const b=e.target.closest(".slot"); if(!b||b.disabled)return;
  state.time=b.dataset.t; renderSlots(); update();
});
document.getElementById("rec").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  document.querySelectorAll("#rec button").forEach(o=>o.setAttribute("aria-pressed",o===b));
  state.rec=+b.dataset.r;
});
function update(){
  const btn=document.getElementById("confirmBtn");
  const p=state.i===null?0:PRICES[state.i];
  document.getElementById("sumPrice").textContent="$"+p;
  document.getElementById("sumTotal").textContent="$"+p;
  if(state.day===null){btn.disabled=true;btn.textContent=t.needDay;return;}
  if(!state.time){btn.disabled=true;btn.textContent=t.needTime;return;}
  btn.disabled=false; btn.textContent=t.confirm+" · $"+p;
}
document.getElementById("confirmBtn").addEventListener("click",()=>{
  const d=days[state.day], code="#CP-"+String(Math.floor(1000+Math.random()*8999));
  appts.unshift({d,time:state.time,i:state.i,pr:PRICES[state.i],code,rec:state.rec});
  const rec=state.rec===2?t.every15:state.rec===4?t.everyMonth:"";
  document.getElementById("doneTxt").innerHTML=
    t.svc[state.i][0]+"<br>"+t.dow[d.getDay()]+", "+d.getDate()+"/"+(d.getMonth()+1)+" · "+state.time+
    (rec?"<br>"+t.repeats+" "+rec:"");
  document.getElementById("doneCode").textContent=code;
  document.getElementById("book").classList.remove("on");
  document.getElementById("done").classList.add("on");
  renderAppts();
});
function renderAppts(){
  const el=document.getElementById("apptList");
  if(!appts.length){el.innerHTML=`<div class="empty"><span class="e-ic">📅</span>${t.empty}</div>`;return;}
  el.innerHTML=appts.map(a=>{
    const rec=a.rec===2?t.every15:a.rec===4?t.everyMonth:"";
    return `<div class="appt"><div class="d"><b>${a.d.getDate()}</b><small>${t.dow[a.d.getDay()]}</small></div>
    <div class="m"><b>${t.svc[a.i][0]}</b><small>${a.time} · ${a.code}${rec?" · "+rec:""}</small></div>
    <div style="font-weight:800;color:var(--g)">$${a.pr}</div></div>`;}).join("");
}
document.querySelectorAll("[data-tab]").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll("[data-tab]").forEach(o=>o.removeAttribute("aria-current"));
    b.setAttribute("aria-current","page");
    const k=b.dataset.tab;
    ["home","agenda","perfil"].forEach(x=>document.getElementById(x).style.display=(x===k)?"block":"none");
    document.querySelector(".greet").style.display=(k==="home")?"block":"none";
    document.querySelector(".brand").style.display=(k==="home")?"flex":"none";
  });
});
document.querySelectorAll(".lg").forEach(b=>b.addEventListener("click",()=>apply(b.dataset.lang)));
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>document.getElementById(b.dataset.close).classList.remove("on")));
apply(pickLang());
</script>
</body>
</html>
