<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VipRide Orlando — demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D1730;--navy2:#152342;--navy3:#1E3055;--line:#2A3E67;--gold:#E3B23C;--gold2:#F5D07E;--sky:#8FA9D4;--paper:#F3F6FB}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Inter Tight",system-ui,sans-serif;background:#070C18;color:var(--paper);display:flex;justify-content:center;min-height:100vh}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:800;line-height:1.1}
.app{width:100%;max-width:420px;background:var(--navy);min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:520px){
  body{align-items:center;padding:24px 0;background:radial-gradient(1000px 500px at 50% 0%,#1A2A4E,#070C18)}
  .app{min-height:0;height:844px;border-radius:34px;box-shadow:0 30px 70px rgba(0,0,0,.6);border:8px solid #1A2340}
}
.top{padding:14px 18px 0;flex:0 0 auto}
.util{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.back-link{color:var(--sky);font-size:12.5px;text-decoration:none;background:var(--navy2);padding:6px 11px;border-radius:16px}
.langs{display:flex;gap:3px;background:var(--navy2);border-radius:16px;padding:3px}
.lg{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:13px;color:var(--sky)}
.lg[aria-pressed="true"]{background:var(--gold);color:#20180A}
.brandrow{display:flex;align-items:center;gap:11px}
.mark{width:42px;height:42px;border-radius:50%;background:var(--gold);color:#20180A;display:grid;place-items:center;font-size:20px}
.brandrow h1{font-size:20px;letter-spacing:-.01em}
.brandrow small{display:block;color:var(--sky);font-size:11.5px;margin-top:2px;font-family:"Inter Tight"}
.tagline{margin:16px 0 4px;font-family:"Fraunces";font-weight:600;font-size:23px;line-height:1.2;max-width:16ch}
.tagline em{font-style:italic;color:var(--gold)}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:14px 18px 4px;scrollbar-width:none;flex:0 0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:var(--navy2);border:1px solid var(--line);border-radius:11px;padding:11px 14px;font-size:13px;font-weight:600;color:var(--sky);display:flex;gap:7px;align-items:center}
.tab[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#20180A}
.scroll{flex:1;overflow-y:auto;padding:16px 18px 190px}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--sky);margin:16px 0 8px}
.field,select.field{width:100%;background:var(--navy2);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;-webkit-appearance:none;appearance:none}
.field::placeholder{color:#5E7BAE}
select.field{background-image:linear-gradient(45deg,transparent 50%,var(--sky) 50%),linear-gradient(135deg,var(--sky) 50%,transparent 50%);background-position:calc(100% - 19px) 21px,calc(100% - 14px) 21px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.route{position:relative;padding-left:26px}
.route::before{content:"";position:absolute;left:6px;top:22px;bottom:22px;width:2px;background:var(--line)}
.route .pin{position:absolute;left:0;width:14px;height:14px;border-radius:50%;border:3px solid var(--gold);background:var(--navy)}
.route .pin.a{top:15px}
.route .pin.b{bottom:15px;border-color:var(--sky);border-radius:3px}
.route .gap{height:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--navy2);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px}
.step span{font-size:14.5px}
.step .ctrl{display:flex;align-items:center;gap:12px}
.step .ctrl button{width:32px;height:32px;border-radius:9px;background:var(--navy3);font-size:18px;font-weight:700;display:grid;place-items:center}
.step .ctrl b{min-width:20px;text-align:center;font-size:16px;font-weight:700}
.cars{display:grid;gap:9px}
.car{display:flex;gap:12px;align-items:center;background:var(--navy2);border:1.5px solid var(--line);border-radius:13px;padding:13px;text-align:left}
.car[aria-pressed="true"]{border-color:var(--gold);background:rgba(227,178,60,.09)}
.car .cic{font-size:26px}
.car .cin{flex:1}
.car .cin b{display:block;font-size:15px;font-weight:600}
.car .cin small{color:var(--sky);font-size:12px}
.car .cpr{color:var(--gold);font-weight:700;font-size:14.5px}
.car[disabled]{opacity:.4}
.opt{display:flex;align-items:center;gap:11px;background:var(--navy2);border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:8px;width:100%;text-align:left;font-size:14.5px}
.opt .sq{width:19px;height:19px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:transparent;flex:0 0 auto}
.opt[aria-pressed="true"] .sq{background:var(--gold);border-color:var(--gold);color:#20180A}
.opt[aria-pressed="true"]{border-color:var(--gold)}
.opt .op{margin-left:auto;color:var(--gold);font-weight:600;font-size:14px}
.quote{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(13,23,48,0),var(--navy) 22%);padding:26px 18px calc(16px + env(safe-area-inset-bottom));z-index:30}
.qcard{background:var(--navy3);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.qtop{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.qtop small{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--sky);font-weight:700;display:block;margin-bottom:2px}
.qtop b{font-family:"Fraunces";font-weight:800;font-size:38px;color:var(--gold);line-height:.95;display:block}
.qmeta{text-align:right;font-size:12px;color:var(--sky);line-height:1.45}
.qbtn{width:100%;background:var(--gold);color:#20180A;border-radius:13px;padding:15px;font-weight:700;font-size:16px;margin-top:14px}
.qnote{text-align:center;font-size:11.5px;color:var(--sky);margin-top:9px}
.sheet{position:absolute;inset:0;background:var(--navy);transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:50;display:flex;flex-direction:column}
.sheet.on{transform:translateY(0)}
.sh-top{padding:16px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.sh-top h2{font-size:17px;flex:1;font-family:"Inter Tight";font-weight:700}
.bk{width:34px;height:34px;border-radius:50%;background:var(--navy3);display:grid;place-items:center;font-size:16px}
.seal{width:80px;height:80px;border-radius:50%;background:var(--gold);color:#20180A;display:grid;place-items:center;font-size:38px;margin:22px auto 16px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.cf h2{text-align:center;font-size:24px;margin-bottom:6px}
.cf .code{display:block;text-align:center;color:var(--gold);letter-spacing:.14em;font-weight:700;font-size:15px;margin-bottom:22px}
.tick-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.tick-row span:first-child{color:var(--sky)}
.tick-row span:last-child{text-align:right;font-weight:600}
.tick-row.big span:last-child{color:var(--gold);font-size:19px;font-weight:700}
.driver{display:flex;gap:13px;align-items:center;background:var(--navy2);border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:20px}
.driver .av{width:46px;height:46px;border-radius:50%;background:var(--navy3);display:grid;place-items:center;font-size:22px}
.driver b{display:block;font-size:15px}
.driver small{color:var(--sky);font-size:12.5px}
.driver .star{margin-left:auto;color:var(--gold);font-weight:700;font-size:14px}
.remind{background:rgba(227,178,60,.09);border:1px solid rgba(227,178,60,.28);border-radius:13px;padding:14px;margin-top:14px;font-size:13px;color:var(--gold2);line-height:1.5}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="util">
      <a class="back-link" href="index.html" id="backLink">← voltar</a>
      <div class="langs"><button class="lg" data-lang="pt" aria-pressed="true">PT</button><button class="lg" data-lang="en">EN</button><button class="lg" data-lang="es">ES</button></div>
    </div>
    <div class="brandrow">
      <div class="mark">✦</div>
      <div><h1>VipRide Orlando</h1><small data-i="sub"></small></div>
    </div>
    <div class="tagline"><span data-i="tagA"></span> <em data-i="tagB"></em> <span data-i="tagC"></span></div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab" data-t="apt" aria-pressed="true">✈️ <span data-i="tabApt"></span></button>
    <button class="tab" data-t="park">🎢 <span data-i="tabPark"></span></button>
    <button class="tab" data-t="shop">🛍️ <span data-i="tabShop"></span></button>
    <button class="tab" data-t="hour">🕒 <span data-i="tabHour"></span></button>
  </div>

  <div class="scroll">
    <div id="routeWrap">
      <div class="lbl" data-i="routeLbl"></div>
      <div class="route">
        <span class="pin a"></span><span class="pin b"></span>
        <select class="field" id="from"></select>
        <div class="gap"></div>
        <select class="field" id="to"></select>
      </div>
      <div class="lbl" data-i="exactLbl"></div>
      <input class="field" id="exact" value="8000 Poinciana Blvd, Kissimmee FL 34747">
    </div>

    <div id="hourWrap" style="display:none">
      <div class="lbl" data-i="hoursLbl"></div>
      <div class="step">
        <span data-i="hoursOfService"></span>
        <span class="ctrl"><button data-h="-1">−</button><b id="hrsN">4</b><button data-h="1">+</button></span>
      </div>
      <div class="lbl" data-i="pickupLbl"></div>
      <input class="field" id="pickup" value="9560 Via Encinas, Davenport FL 33896">
    </div>

    <div class="lbl" data-i="whenLbl"></div>
    <div class="two"><input class="field" type="date" id="date"><input class="field" type="time" id="time" value="10:00"></div>

    <div class="lbl" data-i="whoLbl"></div>
    <div class="step" style="margin-bottom:9px"><span data-i="pax"></span>
      <span class="ctrl"><button data-p="-1">−</button><b id="paxN">2</b><button data-p="1">+</button></span></div>
    <div class="step"><span data-i="bags"></span>
      <span class="ctrl"><button data-b="-1">−</button><b id="bagN">2</b><button data-b="1">+</button></span></div>

    <div class="lbl" data-i="vehicleLbl"></div>
    <div class="cars" id="cars"></div>

    <div class="lbl" data-i="extrasLbl"></div>
    <div id="extras"></div>
  </div>

  <div class="quote">
    <div class="qcard">
      <div class="qtop">
        <div><small data-i="totalLbl"></small><b id="qVal">$0</b></div>
        <div class="qmeta" id="qMeta"></div>
      </div>
      <button class="qbtn" id="qBtn">—</button>
      <div class="qnote" data-i="qNote"></div>
    </div>
  </div>

  <div class="sheet" id="cf">
    <div class="sh-top"><button class="bk" data-close="cf">←</button><h2 data-i="cfTitle"></h2></div>
    <div class="scroll" style="padding-bottom:40px">
      <div class="cf">
        <div class="seal">✓</div>
        <h2 data-i="cfAllSet"></h2>
        <span class="code" id="cfCode">VR-0000</span>
        <div class="tick-row"><span data-i="rService"></span><span id="cfSvc">—</span></div>
        <div class="tick-row"><span data-i="rFrom"></span><span id="cfFrom">—</span></div>
        <div class="tick-row"><span data-i="rTo"></span><span id="cfTo">—</span></div>
        <div class="tick-row"><span data-i="rWhen"></span><span id="cfWhen">—</span></div>
        <div class="tick-row"><span data-i="rCar"></span><span id="cfCar">—</span></div>
        <div class="tick-row big"><span data-i="rTotal"></span><span id="cfTot">—</span></div>
        <div class="driver">
          <div class="av">🧑‍✈️</div>
          <div><b>Anderson M.</b><small data-i="driverCar"></small></div>
          <div class="star">4.9 ★</div>
        </div>
        <div class="remind" data-i="cfRemind"></div>
      </div>
    </div>
  </div>
</div>

<script>
const PK=["mco","sfb","idr","uni","dis","kis","dav","wg","spr","vin","out"];
const PRICE={mco:0,sfb:25,idr:65,uni:70,dis:80,kis:85,dav:95,wg:90,spr:78,vin:70,out:68};
const CARS=[{id:"sed",ic:"🚗",pax:3,bag:3,mult:1},{id:"suv",ic:"🚙",pax:6,bag:6,mult:1.35},{id:"van",ic:"🚐",pax:10,bag:12,mult:1.7}];
const XP=[10,25,0];

const T={
pt:{code:"pt-BR",back:"← voltar",sub:"Motorista particular · português, inglês e espanhol",
 tagA:"Reserve o seu",tagB:"traslado",tagC:"em 30 segundos.",
 tabApt:"Aeroporto",tabPark:"Parques",tabShop:"Outlets",tabHour:"Diária",
 routeLbl:"Trajeto",exactLbl:"Hotel ou endereço exato",exactPh:"Rua, número, cidade",
 hoursLbl:"Quantas horas",hoursOfService:"Horas de serviço (mínimo 4)",pickupLbl:"Onde te buscar",
 whenLbl:"Quando",whoLbl:"Quem vai",pax:"Passageiros",bags:"Malas grandes",
 vehicleLbl:"Veículo",extrasLbl:"Adicionais",
 cars:[["Sedan executivo","até 3 pessoas · 3 malas"],["SUV grande","até 6 pessoas · 6 malas"],["Van executiva","até 10 pessoas · 12 malas"]],
 tooSmall:"não comporta o grupo",basePrice:"base",
 extras:["Cadeirinha de criança","Parada no mercado (30 min)","Placa com o seu nome no desembarque"],free:"grátis",
 totalLbl:"Valor total",book:"Reservar por",qNote:"Preço fechado. Sem tarifa dinâmica, sem surpresa.",
 places:{mco:"Aeroporto MCO",sfb:"Aeroporto Sanford (SFB)",idr:"International Drive",uni:"Universal / CityWalk",dis:"Disney / Lake Buena Vista",kis:"Kissimmee / Hwy 192",dav:"Davenport / ChampionsGate",wg:"Winter Garden / Clermont",spr:"Disney Springs",vin:"Vineland Premium Outlets",out:"Orlando Premium Outlets"},
 svcNames:{apt:"Traslado do aeroporto",park:"Ida e volta aos parques",shop:"Compras nos outlets",hour:"Diária de motorista"},
 cfTitle:"Reserva confirmada",cfAllSet:"Tudo certo!",
 rService:"Serviço",rFrom:"Saída",rTo:"Destino",rWhen:"Data e hora",rCar:"Veículo",rTotal:"Total",
 hoursAvail:"horas à disposição",paxWord:"pax",bagsWord:"malas",
 driverCar:"Chevrolet Suburban preta · 412 viagens",
 cfRemind:"🔔 Você recebe um lembrete no celular na véspera e outro 2 horas antes da saída — e o motorista acompanha o seu voo se ele atrasar."},
en:{code:"en",back:"← back",sub:"Private driver · English, Portuguese and Spanish",
 tagA:"Book your",tagB:"ride",tagC:"in 30 seconds.",
 tabApt:"Airport",tabPark:"Parks",tabShop:"Outlets",tabHour:"By the hour",
 routeLbl:"Route",exactLbl:"Hotel or exact address",exactPh:"Street, number, city",
 hoursLbl:"How many hours",hoursOfService:"Hours of service (4 minimum)",pickupLbl:"Where to pick you up",
 whenLbl:"When",whoLbl:"Who's going",pax:"Passengers",bags:"Large bags",
 vehicleLbl:"Vehicle",extrasLbl:"Extras",
 cars:[["Executive sedan","up to 3 people · 3 bags"],["Large SUV","up to 6 people · 6 bags"],["Executive van","up to 10 people · 12 bags"]],
 tooSmall:"too small for your group",basePrice:"base",
 extras:["Child car seat","Grocery stop (30 min)","Name sign at arrivals"],free:"free",
 totalLbl:"Total price",book:"Book for",qNote:"Flat price. No surge, no surprises.",
 places:{mco:"MCO Airport",sfb:"Sanford Airport (SFB)",idr:"International Drive",uni:"Universal / CityWalk",dis:"Disney / Lake Buena Vista",kis:"Kissimmee / Hwy 192",dav:"Davenport / ChampionsGate",wg:"Winter Garden / Clermont",spr:"Disney Springs",vin:"Vineland Premium Outlets",out:"Orlando Premium Outlets"},
 svcNames:{apt:"Airport transfer",park:"Round trip to the parks",shop:"Outlet shopping trip",hour:"Driver by the hour"},
 cfTitle:"Booking confirmed",cfAllSet:"All set!",
 rService:"Service",rFrom:"Pickup",rTo:"Drop-off",rWhen:"Date and time",rCar:"Vehicle",rTotal:"Total",
 hoursAvail:"hours at your disposal",paxWord:"pax",bagsWord:"bags",
 driverCar:"Black Chevrolet Suburban · 412 trips",
 cfRemind:"🔔 You get a reminder on your phone the day before and another 2 hours before pickup — and the driver tracks your flight if it's delayed."},
es:{code:"es",back:"← volver",sub:"Chofer privado · español, portugués e inglés",
 tagA:"Reserva tu",tagB:"traslado",tagC:"en 30 segundos.",
 tabApt:"Aeropuerto",tabPark:"Parques",tabShop:"Outlets",tabHour:"Por hora",
 routeLbl:"Trayecto",exactLbl:"Hotel o dirección exacta",exactPh:"Calle, número, ciudad",
 hoursLbl:"Cuántas horas",hoursOfService:"Horas de servicio (mínimo 4)",pickupLbl:"Dónde recogerte",
 whenLbl:"Cuándo",whoLbl:"Quiénes van",pax:"Pasajeros",bags:"Maletas grandes",
 vehicleLbl:"Vehículo",extrasLbl:"Adicionales",
 cars:[["Sedán ejecutivo","hasta 3 personas · 3 maletas"],["SUV grande","hasta 6 personas · 6 maletas"],["Van ejecutiva","hasta 10 personas · 12 maletas"]],
 tooSmall:"no alcanza para el grupo",basePrice:"base",
 extras:["Silla para bebé","Parada en el súper (30 min)","Cartel con tu nombre en llegadas"],free:"gratis",
 totalLbl:"Precio total",book:"Reservar por",qNote:"Precio cerrado. Sin tarifa dinámica, sin sorpresas.",
 places:{mco:"Aeropuerto MCO",sfb:"Aeropuerto Sanford (SFB)",idr:"International Drive",uni:"Universal / CityWalk",dis:"Disney / Lake Buena Vista",kis:"Kissimmee / Hwy 192",dav:"Davenport / ChampionsGate",wg:"Winter Garden / Clermont",spr:"Disney Springs",vin:"Vineland Premium Outlets",out:"Orlando Premium Outlets"},
 svcNames:{apt:"Traslado del aeropuerto",park:"Ida y vuelta a los parques",shop:"Compras en los outlets",hour:"Chofer por hora"},
 cfTitle:"Reserva confirmada",cfAllSet:"¡Todo listo!",
 rService:"Servicio",rFrom:"Recogida",rTo:"Destino",rWhen:"Fecha y hora",rCar:"Vehículo",rTotal:"Total",
 hoursAvail:"horas a tu disposición",paxWord:"pax",bagsWord:"maletas",
 driverCar:"Chevrolet Suburban negra · 412 viajes",
 cfRemind:"🔔 Recibes un recordatorio en el celular la víspera y otro 2 horas antes de la salida — y el chofer sigue tu vuelo si se retrasa."}};

let lang="pt", t=T.pt, trip="apt", car="sed", pax=2, bag=2, hrs=4, xs=[];
const fromSel=document.getElementById("from"), toSel=document.getElementById("to");

function pickLang(){
  const q=new URLSearchParams(location.search).get("lang");
  if(q&&T[q])return q;
  const n=(navigator.language||"pt").slice(0,2).toLowerCase();
  return T[n]?n:"en";
}
function fill(sel,keys,def){
  const keep=sel.value;
  sel.innerHTML=keys.map(k=>`<option value="${k}">${t.places[k]}</option>`).join("");
  sel.value=keys.includes(keep)?keep:def;
}
function setTrip(x,keepSel){
  trip=x;
  document.getElementById("routeWrap").style.display=x==="hour"?"none":"block";
  document.getElementById("hourWrap").style.display=x==="hour"?"block":"none";
  if(!keepSel){ fromSel.value=""; toSel.value=""; }
  if(x==="apt"){fill(fromSel,["mco","sfb","idr","uni","dis","kis","dav","wg"],"mco");fill(toSel,["idr","uni","dis","kis","dav","wg","mco","sfb"],"kis");}
  if(x==="park"){fill(fromSel,["idr","uni","dis","kis","dav","wg"],"kis");fill(toSel,["dis","uni","spr","idr"],"dis");}
  if(x==="shop"){fill(fromSel,["idr","uni","dis","kis","dav","wg"],"kis");fill(toSel,["vin","out","spr"],"vin");}
  quote();
}
function renderCars(){
  document.getElementById("cars").innerHTML=CARS.map((c,i)=>{
    const bad=pax>c.pax||bag>c.bag;
    return `<button class="car" data-car="${c.id}" aria-pressed="${c.id===car}" ${bad?"disabled":""}>
      <span class="cic">${c.ic}</span><span class="cin"><b>${t.cars[i][0]}</b><small>${bad?t.tooSmall:t.cars[i][1]}</small></span>
      <span class="cpr">${c.mult===1?t.basePrice:"+"+Math.round((c.mult-1)*100)+"%"}</span></button>`;
  }).join("");
}
function renderExtras(){
  document.getElementById("extras").innerHTML=t.extras.map((x,i)=>`
    <button class="opt" data-x="${i}" aria-pressed="${xs.includes(i)}"><span class="sq">✓</span><span>${x}</span>
    <span class="op">${XP[i]?"+$"+XP[i]:t.free}</span></button>`).join("");
}
function apply(l){
  lang=l; t=T[l];
  document.documentElement.lang=t.code;
  document.querySelectorAll("[data-i]").forEach(el=>{el.textContent=t[el.dataset.i];});
  document.querySelectorAll(".lg").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));
  const bl=document.getElementById("backLink"); bl.textContent=t.back; bl.href="index.html?lang="+l;
  document.getElementById("exact").placeholder=t.exactPh;
  document.getElementById("pickup").placeholder=t.exactPh;
  setTrip(trip,true); renderCars(); renderExtras(); quote();
}
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab"); if(!b)return;
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-pressed",x===b));
  setTrip(b.dataset.t,false);
});
document.getElementById("cars").addEventListener("click",e=>{
  const b=e.target.closest(".car"); if(!b||b.disabled)return;
  car=b.dataset.car; renderCars(); quote();
});
document.getElementById("extras").addEventListener("click",e=>{
  const b=e.target.closest(".opt"); if(!b)return;
  const i=+b.dataset.x, at=xs.indexOf(i);
  if(at>=0)xs.splice(at,1); else xs.push(i);
  b.setAttribute("aria-pressed",at<0); quote();
});
document.querySelector(".scroll").addEventListener("click",e=>{
  const b=e.target.closest("[data-p],[data-b],[data-h]"); if(!b)return;
  if(b.dataset.p){pax=Math.min(10,Math.max(1,pax+(+b.dataset.p)));document.getElementById("paxN").textContent=pax;}
  if(b.dataset.b){bag=Math.min(12,Math.max(0,bag+(+b.dataset.b)));document.getElementById("bagN").textContent=bag;}
  if(b.dataset.h){hrs=Math.min(12,Math.max(4,hrs+(+b.dataset.h)));document.getElementById("hrsN").textContent=hrs;}
  const c=CARS.find(x=>x.id===car);
  if(pax>c.pax||bag>c.bag){const nx=CARS.find(x=>pax<=x.pax&&bag<=x.bag); if(nx)car=nx.id;}
  renderCars(); quote();
});
[fromSel,toSel].forEach(s=>s.addEventListener("change",quote));

function base(){
  const c=CARS.find(x=>x.id===car);
  if(trip==="hour")return 55*hrs*c.mult;
  const a=PRICE[fromSel.value]||0, b=PRICE[toSel.value]||0;
  let v=Math.max(a,b);
  if(a>0&&b>0)v=Math.max(55,Math.abs(a-b)+40);
  if(trip==="shop")v*=2.4;
  if(trip==="park")v*=2.2;
  return v*c.mult;
}
function quote(){
  const c=CARS.find(x=>x.id===car), i=CARS.indexOf(c);
  let total=base(); xs.forEach(x=>total+=XP[x]); total=Math.round(total);
  document.getElementById("qVal").textContent="$"+total;
  const meta = trip==="hour"
    ? hrs+"h<br>"+t.cars[i][0]
    : (t.places[fromSel.value]||"").split(" /")[0]+" → "+(t.places[toSel.value]||"").split(" /")[0]+"<br>"+t.cars[i][0];
  document.getElementById("qMeta").innerHTML=meta+"<br>"+pax+" "+t.paxWord+" · "+bag+" "+t.bagsWord;
  document.getElementById("qBtn").textContent=t.book+" $"+total;
  return total;
}
const d0=new Date(); d0.setDate(d0.getDate()+3);
document.getElementById("date").value=d0.toISOString().slice(0,10);

document.getElementById("qBtn").addEventListener("click",()=>{
  const c=CARS.find(x=>x.id===car), i=CARS.indexOf(c);
  document.getElementById("cfCode").textContent="VR-"+Math.floor(1000+Math.random()*8999);
  document.getElementById("cfSvc").textContent=t.svcNames[trip];
  document.getElementById("cfFrom").textContent=trip==="hour"
    ? (document.getElementById("pickup").value||"—")
    : t.places[fromSel.value];
  document.getElementById("cfTo").textContent=trip==="hour"
    ? hrs+" "+t.hoursAvail
    : t.places[toSel.value]+" — "+(document.getElementById("exact").value||"—");
  const dt=document.getElementById("date").value.split("-");
  document.getElementById("cfWhen").textContent=(lang==="en"?dt[1]+"/"+dt[2]:dt[2]+"/"+dt[1])+" · "+document.getElementById("time").value;
  document.getElementById("cfCar").textContent=t.cars[i][0]+" · "+pax+" "+t.paxWord;
  document.getElementById("cfTot").textContent=document.getElementById("qVal").textContent;
  document.getElementById("cf").classList.add("on");
});
document.querySelectorAll(".lg").forEach(b=>b.addEventListener("click",()=>apply(b.dataset.lang)));
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>document.getElementById(b.dataset.close).classList.remove("on")));
apply(pickLang());
</script>
</body>
</html>
